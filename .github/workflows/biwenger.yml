name: Biwenger Agent

# 1. ¿CUÁNDO SE EJECUTA?
on:
  # Disparador manual (El botón "Run Workflow" para hacerlo a tu antojo)
  workflow_dispatch:

  # Disparador automático (Reloj)
  schedule:
    # 06:00, 12:00, 17:00, 21:00 UTC (Equivale aprox a 08:00, 14:00, 19:00 y 23:00 en España verano)
    - cron: '0 6,12,17,21 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Sistema de reintentos nativo por si Biwenger falla
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas
        run: npm install

      - name: Despertar al Agente Biwenger
        # Le pasamos las contraseñas desde la caja fuerte de GitHub
        env:
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
          BIWENGER_USER_ID: ${{ secrets.BIWENGER_USER_ID }}
          FECHA_INICIO_PUJAS: ${{ vars.FECHA_INICIO_PUJAS }}
          MAX_JUGADORES_PLANTILLA: ${{ vars.MAX_JUGADORES_PLANTILLA }}
        run: |
          echo "🛡️ [Anti-Baneo] Iniciando ofuscación de horario (margen de 10 minutos)..."
          sleep $((RANDOM % 600 + 1))
          npm start

      - name: Publicar reporte HTML en GitHub Pages
        run: |
          git config --global user.name "Biwenger Bot"
          git config --global user.email "bot@biwenger.local"
          git add docs/index.html docs/stats.json
          git commit -m "docs: actualizar reporte diario e inteligencia [skip ci]" || echo "No hay cambios que reportar"
          git push
