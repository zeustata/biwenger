<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#shieldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Shield Shape -->
  <path d="M 256 90 L 380 140 C 380 270 340 370 256 420 C 172 370 132 270 132 140 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Crown Icon -->
  <path d="M 190 230 L 220 200 L 256 240 L 292 200 L 322 230 L 310 270 L 202 270 Z" fill="#fbbf24"/>

  <!-- Soccer Ball / Star -->
  <circle cx="256" cy="315" r="35" fill="#ffffff"/>
  <polygon points="256,290 266,308 286,310 271,323 276,343 256,331 236,343 241,323 226,310 246,308" fill="#0f172a"/>
</svg>